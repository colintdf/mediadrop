name: Mac CD client
on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/macos-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Build, test and package native client
        run: bash client/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MediaDrop-Ripper-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MediaDrop-Ripper-*
          merge-multiple: true
          path: installers
      - name: Publish downloadable DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          tag="ripper-1.1.1-build.$BUILD_NUMBER"
          cat > notes.txt <<'NOTES'
          Native MediaDrop CD Ripper for macOS 14 or later.

          Download arm64 for Apple Silicon (M-series). Intel builds are paused.
          Open the DMG and drag MediaDrop Ripper into Applications. No Terminal setup is needed.
          Requires MediaDrop server 1.6 or later.

          This is an initial hardware-test build. The Apple Silicon app compiles and launches on macOS 14, its bundled encoder and core tests pass, and every bundled binary is checked for a macOS 14-compatible deployment target. Reading a real audio CD still needs checking on your Mac. The second-read option is not AccurateRip verification.

          The app is ad-hoc signed, not Apple notarised. If macOS blocks it, open it once, then use System Settings > Privacy & Security > Open Anyway for this app.
          NOTES
          gh release create "$tag" installers/* --target "$COMMIT_SHA" --prerelease --title "MediaDrop Ripper 1.1.1 · Build $BUILD_NUMBER" --notes-file notes.txt
