# Run from the directory containing your existing compose.yaml:
# docker compose -f compose.yaml -f mediadrop/compose.stack.yaml up -d --build mediadrop
# Relative build context is resolved from the FIRST Compose file's directory.
services:
  mediadrop:
    build:
      context: ./mediadrop
      args:
        PUID: "${MEDIADROP_UID:-501}"
        PGID: "${MEDIADROP_GID:-20}"
    image: mediadrop:local
    container_name: mediadrop
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    ports:
      - "12345:12345"
    environment:
      TZ: Europe/London
    volumes:
      - mediadrop_data:/data
      - type: bind
        source: ${MEDIADROP_MUSIC_PATH:?Set MEDIADROP_MUSIC_PATH in .env to your existing music folder}
        target: /music
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777

volumes:
  mediadrop_data:
